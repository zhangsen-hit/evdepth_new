batch_size:
  eval: 1
  train: 1
dataset:
  center_crop_hw:
  - 256
  - 344
  data_augmentation:
    random:
      prob_hflip: 0.5
      rotate:
        max_angle_deg: 5
        min_angle_deg: 2
        prob: 0.2
      zoom:
        prob: 0.8
        zoom_in:
          factor:
            max: 1.3
            min: 1
          weight: 8
        zoom_out:
          factor:
            max: 1.15
            min: 1
          weight: 2
    stream:
      prob_hflip: 0.0
      rotate:
        max_angle_deg: 4
        min_angle_deg: 2
        prob: 0.1
      zoom:
        prob: 0.5
        zoom_out:
          factor:
            max: 1.1
            min: 1
  debug_start_npz_index: None
  depth_key: label
  depth_mask_key: null
  depth_range:
    max: 80.0
    min: 0.5
  downsample_by_factor_2: false
  ev_key: input
  eval:
    sampling: random
  frame_interval_sec: 0.005
  load_depth: true
  max_interval_deviation_sec: 0.003
  name: liosam
  normalize_events_nonzero: true
  only_load_end_labels: false
  patch_crop_hw:
  - 256
  - 344
  path: /home/zs/Research3/dataset/
  resolution_hw:
  - 256
  - 344
  sequence_length: 6
  train:
    mixed:
      w_random: 1
      w_stream: 1
    random:
      weighted_sampling: false
    sampling: random
  train_scenes:
  - '00'
  - '01'
  - '02'
  - '04'
  - '05'
  - '06'
  - '07'
  - 08
  - 09
  - '10'
  - '11'
  - '12'
  - '14'
  - '15'
  - '16'
  - '17'
  val_scenes:
  - '03'
  - '13'
hardware:
  dist_backend: nccl
  gpus: 0
  num_workers:
    eval: 0
    train: 0
logging:
  ckpt_every_n_epochs: 1
  train:
    high_dim:
      enable: false
      every_n_steps: 5000
      n_samples: 4
    log_every_n_steps: 50
    log_model_every_n_steps: 5000
    metrics:
      compute: false
      depth_metrics_every_n_steps: null
  validation:
    high_dim:
      enable: true
      every_n_epochs: 1
      n_samples: 1
model:
  backbone:
    T_max_chrono_init_encoder:
    - 4
    - 8
    - 16
    composition: sigrad_only
    encoder_lstm:
      drop_cell_update: 0.0
      dws_conv: true
      dws_conv_kernel_size: 5
      dws_conv_only_hidden: true
      dws_on_spatial_m: true
      use_group_norm: true
      zigzag: true
      norm_components:
      - spatial
      - memory
    encoder_lstm_type: stlstm
    grad_num_scales: 4
    grad_start_scale: 1
    grad_weight: 0.25
    in_res_hw:
    - 256
    - 344
    input_channels: 2
    name: E2DepthConvLSTMUNet
    si_lambda: 0.5
    si_weight: 1.0
    use_batchnorm: false
  depth_range:
    max: 80.0
    min: 0.5
  loss:
    berhu_threshold: 0.2
    berhu_weight: 0.2
    composition: sigrad_only
    grad_num_scales: 4
    grad_start_scale: 1
    grad_weight: 0.25
    si_lambda: 0.5
    si_weight: 1.0
  name: depth
reproduce:
  benchmark: false
  deterministic_flag: false
  seed_everything: null
training:
  gradient_clip_val: 1.0
  learning_rate: 0.0005
  limit_train_batches: 1.0
  lr_scheduler:
    div_factor: 25
    final_div_factor: 10000
    pct_start: 0.2
    total_steps: 3000
    use: true
  max_epochs: 1000
  max_steps: 3000
  precision: 16-mixed
  weight_decay: 0.005
validation:
  check_val_every_n_epoch: 1
  limit_val_batches: 0.05
  val_check_interval: 500
wandb:
  artifact_local_file: null
  artifact_name: null
  group_name: liosam_depth
  project_name: EventDepth
  resume_only_weights: false
  wandb_runpath: null
