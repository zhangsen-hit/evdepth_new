# ============================================================================
# 深度估计项目 - LiOSAM odometry2 depth_dataset 配置（E2Depth ConvLSTM U-Net）
# ============================================================================
# 数据：index.txt + *.npz，每 npz 含事件张量 (2,260,346) 与深度图
# 序列：时间连续 sequence_length 帧为一组，相邻帧约 5ms，允许 ±3ms 偏差
# 加载：一半顺序(stream)、一半随机(random)，即 mixed 模式
# ============================================================================

# ----------------------------------------------------------------------------
# 数据集配置
# ----------------------------------------------------------------------------
dataset:
  name: liosam
  path: /home/zs/Research3/dataset/
  
  # 序列长度（可调）。12GB 显存建议 24；显存充足可改为 50 或 200
  sequence_length: 6
  
  # 时间连续性：正常间隔约 5ms，允许 3ms 以内偏差 → [2ms, 8ms]
  frame_interval_sec: 0.005
  max_interval_deviation_sec: 0.003
  
  # 多场景划分：指定哪些场景用于训练、哪些用于验证
  # path 下应包含以场景名命名的子目录（如 00/, 01/, ...），每个子目录含 index.txt + npz
  train_scenes: ["00","01","02","04","05","06","07","08","09","10","11","12","14","15","16","17"]
  val_scenes: ["03","13"]
  
  # npz 内 key：input=(2,260,346) 事件张量, label=(260,346) 深度真值（含 inf 处会生成 mask 排除）
  ev_key: input
  depth_key: label
  depth_mask_key: null  # 无单独 mask，从 label 的 isfinite 与范围生成
  
  # 中心裁剪后分辨率（与 model.backbone.in_res_hw 一致，H/W 可被 8 整除）
  resolution_hw: [256, 344]
  center_crop_hw: [256, 344]
  # patch crop（参考 rpg_e2depth）：训练随机 crop、验证中心 crop，112 可被 8/4 整除
  # 同一序列内的所有帧共享同一 (y0, x0) 与翻转选择
  patch_crop_hw: [256, 344]
  normalize_events_nonzero: true

  downsample_by_factor_2: False
  only_load_end_labels: False
  load_depth: true
  
  # 深度有效范围（米），用于 clamp 与 mask
  depth_range:
    min: 0.5
    max: 80.0
  
  # 训练：12GB 显存用 stream+bs1；显存充足可改为 mixed + 更大 batch
  train:
    sampling: 'random'  # 使用纯随机(Random Access)采样
    random:
      weighted_sampling: False
    mixed:
      w_stream: 1
      w_random: 1
  
  eval:
    sampling: 'random'

  debug_start_npz_index: None
  
  data_augmentation:
    random:
      prob_hflip: 0.5 # 实际生效的水平翻转
      rotate:
        prob: 0.2
        min_angle_deg: 2
        max_angle_deg: 5
      zoom:
        prob: 0.8
        zoom_in:
          weight: 8
          factor:
            min: 1
            max: 1.3
        zoom_out:
          weight: 2
          factor:
            min: 1
            max: 1.15
    stream:
      # h-flip 由 patch crop augmentor 处理（在序列加载层应用），此处置 0 以免双重翻转
      prob_hflip: 0.0
      rotate:
        prob: 0.1
        min_angle_deg: 2
        max_angle_deg: 4
      zoom:
        prob: 0.5
        zoom_out:
          factor:
            min: 1
            max: 1.1

# ----------------------------------------------------------------------------
# 模型配置（输入 2×256×344，E2DepthConvLSTMUNet 端到端）
# ----------------------------------------------------------------------------
model:
  name: depth

  backbone:
    name: E2DepthConvLSTMUNet
    input_channels: 2
    # 与训练/验证实际进入网络的 patch 尺寸一致（dataset.patch_crop_hw）
    # 注意：测试/推理脚本 (run_depth.py / test.py) 仍按 center_crop_hw=[256,344] 输入，
    # 若仍想对全分辨率推理，请把 in_res_hw 改回 [256, 344]，模型为全卷积无需重训。
    in_res_hw: [256, 344]
    use_batchnorm: false
    # stand_convlstm: 标准 3×3 门控卷积；dws_convlstm: 可分离卷积版；
    # stlstm: PredRNN 风格 ST-LSTM（双记忆 C+M），可配合 zigzag 跨层/跨时间步流动
    encoder_lstm_type: stlstm
    # 与 MobileNet 阶段 chrono 类似，供各 encoder ConvLSTM 使用（可选）
    T_max_chrono_init_encoder: [4, 8, 16]
    encoder_lstm:
      dws_conv: true
      dws_conv_only_hidden: true
      dws_conv_kernel_size: 5
      drop_cell_update: 0.0
      # 仅在 encoder_lstm_type=stlstm 时生效
      zigzag: true            # true 启用 last-stage(t-1) -> first-stage(t) zigzag 路由
      dws_on_spatial_m: true  # 在 m_{t-1} 上也用 5x5 dws（PredRNN 风格）
      use_group_norm: false   # 速度消融：关闭 ST-LSTM 内部 GroupNorm
    # 注：以下 composition / si_* / grad_* 字段历史上写在 backbone 下其实不会被读取，
    # 实际生效的是下面 model.loss 段。这里保留仅作可读性参考。
    composition: sigrad_only
    si_weight: 1.0
    si_lambda: 0.5
    grad_weight: 0.25
    grad_start_scale: 1
    grad_num_scales: 4

  # ----------------------------------------------------------------------------
  # 损失函数配置（depth_estimator.py 真正读取的位置）
  # sigrad_only = ScaleInvariantMaskedLoss + E2DepthMultiScaleGradientLoss [+ Berhu]
  # 修改记录：
  #   - si_lambda 1.0 -> 0.5：从完全尺度不变改为部分尺度不变，约束绝对尺度
  #   - 新增 Berhu 锚定项 weight=0.2：在 norm_log 空间做 L1-like 监督，
  #     彻底消除 SI/grad 损失对常数偏移不敏感导致的 delta1 漂移
  # ----------------------------------------------------------------------------
  loss:
    composition: sigrad_only
    si_weight: 1.0
    si_lambda: 0.5
    grad_weight: 0.25
    grad_start_scale: 1
    grad_num_scales: 4
    berhu_weight: 0.2
    berhu_threshold: 0.2

  depth_range:
    min: 0.5
    max: 80.0

# ----------------------------------------------------------------------------
# 训练配置
# ----------------------------------------------------------------------------
training:
  precision: "16-mixed"
  max_epochs: 1000
  # 短训验证：3000 step 足以判断 loss 是否下降、有无 NaN/梯度爆炸
  max_steps: 3000
  learning_rate: 0.0005
  weight_decay: 0.005
  gradient_clip_val: 1.0
  limit_train_batches: 1.0

  lr_scheduler:
    use: True
    total_steps: 3000
    pct_start: 0.2
    div_factor: 25
    final_div_factor: 10000

# ----------------------------------------------------------------------------
# 验证配置
# ----------------------------------------------------------------------------
validation:
  # 短训：每 500 step 验证一次（int -> 按 step 计），并限制 val 只跑 5%
  # 这样我们能在 ~30min 内看到 6 个验证点
  limit_val_batches: 0.05
  val_check_interval: 500
  check_val_every_n_epoch: 1

# ----------------------------------------------------------------------------
# Batch Size（12GB 显存：train=1 eval=1；显存充足可改为 2 或 4）
# ----------------------------------------------------------------------------
batch_size:
  train: 1
  eval: 1

# ----------------------------------------------------------------------------
# 硬件配置
# ----------------------------------------------------------------------------
hardware:
  num_workers:
    train: 0
    eval: 0
  gpus: 0
  dist_backend: "nccl"

# ----------------------------------------------------------------------------
# 日志和可视化
# ----------------------------------------------------------------------------
logging:
  ckpt_every_n_epochs: 1
  
  train:
    metrics:
      compute: false
      depth_metrics_every_n_steps: null
    log_model_every_n_steps: 5000
    log_every_n_steps: 50
    high_dim:
      enable: False
      every_n_steps: 5000
      n_samples: 4
  
  validation:
    high_dim:
      enable: True
      every_n_epochs: 1
      n_samples: 1

# ----------------------------------------------------------------------------
# WandB配置
# ----------------------------------------------------------------------------
wandb:
  wandb_runpath: null
  artifact_name: null
  artifact_local_file: null
  resume_only_weights: False
  group_name: liosam_depth
  project_name: EventDepth

# ----------------------------------------------------------------------------
# 可复现性设置
# ----------------------------------------------------------------------------
reproduce:
  seed_everything: null
  deterministic_flag: False
  benchmark: False
